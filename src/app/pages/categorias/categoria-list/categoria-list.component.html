<section class="page">
  <div class="header">
    <h1>Categorías</h1>
    @if (authService.isAdmin()) {
      <a routerLink="/categorias/nuevo">Nueva categoría</a>
    }
  </div>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Descripción</th>
      @if (authService.isAdmin()) {
        <th>Acciones</th>
      }
    </tr>
    </thead>
    <tbody>
      @for (c of categorias; track c.id) {
        <tr>
          <td>{{ c.id }}</td>
          <td>{{ c.nombre }}</td>
          <td>{{ c.descripcion }}</td>
          @if (authService.isAdmin()) {
            <td>
              <a [routerLink]="['/categorias', c.id, 'editar']">Editar</a>
              <button type="button" (click)="eliminar(c.id)">Eliminar</button>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</section>
