<section class="page">
  <h1>{{ esEdicion ? 'Editar categoría' : 'Nueva categoría' }}</h1>

  <form (ngSubmit)="onSubmit()">
    <label>
      Nombre
      <input type="text" name="nombre" [(ngModel)]="categoria.nombre" required />
    </label>

    <label>
      Descripción
      <input type="text" name="descripcion" [(ngModel)]="categoria.descripcion" />
    </label>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit">Guardar</button>
    <a routerLink="/categorias">Cancelar</a>
  </form>
</section>
